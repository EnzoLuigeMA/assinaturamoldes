<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--sans);background:#222}

.motifbox{height:430px;display:grid;place-items:center;margin-bottom:40px}

.badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.badge{font-size:23px;font-weight:600;color:var(--inks);background:rgba(246,234,224,.05);border:1px solid rgba(246,234,224,.16);border-radius:100px;padding:12px 20px}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--coral);color:var(--onc);font-weight:800;font-size:32px;border-radius:18px;padding:26px 44px;box-shadow:0 16px 38px rgba(240,113,79,.32);margin-top:42px}
.micro{margin-top:14px;color:var(--muted);font-weight:600;font-size:23px}
