<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1920px;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:150px 80px;
background:radial-gradient(1100px 680px at 50% -8%,rgba(240,113,79,.16),rgba(240,113,79,0) 56%),radial-gradient(820px 560px at 50% 112%,rgba(227,173,87,.09),rgba(227,173,87,0) 60%),var(--bg)}
.seam{height:0;border-top:3px dashed var(--coral);width:70px;margin-bottom:34px}
.motifbox{height:430px;display:grid;place-items:center;margin-bottom:40px}
.motifbox svg{height:100%;width:auto;max-width:100%}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.012em;line-height:1.08;font-size:76px;text-wrap:balance;max-width:18ch}
h1 b{color:var(--coral);font-weight:400}
.sub{font-size:29px;line-height:1.5;color:var(--inks);margin-top:24px;max-width:30ch}
.badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.badge{font-size:23px;font-weight:600;color:var(--inks);background:rgba(246,234,224,.05);border:1px solid rgba(246,234,224,.16);border-radius:100px;padding:12px 20px}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--coral);color:var(--onc);font-weight:800;font-size:32px;border-radius:18px;padding:26px 44px;box-shadow:0 16px 38px rgba(240,113,79,.32);margin-top:42px}
.micro{margin-top:14px;color:var(--muted);font-weight:600;font-size:23px}
</style></head><body><div class="stage">
<div class="motifbox"><svg viewBox="0 0 200 200" fill="none">
<circle cx="100" cy="100" r="92" stroke="#e3ad57" stroke-width="2" stroke-dasharray="2 7" opacity=".8"/>
<circle cx="100" cy="100" r="80" stroke="#e3ad57" stroke-width="3"/>
<circle cx="100" cy="100" r="73" stroke="#e3ad57" stroke-width="1" opacity=".5"/>
<text x="100" y="92" text-anchor="middle" font-family="Young Serif,serif" font-size="62" fill="#e3ad57">7</text>
<text x="100" y="120" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#f6eae0">DIAS</text>
<text x="100" y="146" text-anchor="middle" font-family="Hanken Grotesk,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#d3aaa4">GARANTIA</text>
<g stroke="#f0714f" stroke-width="2.2" stroke-linecap="round"><path d="M64 158 L80 150"/><circle cx="62" cy="159" r="3.4" fill="#f0714f" stroke="none"/><path d="M80 150 q22 -10 40 0" opacity=".6" stroke-dasharray="2 6"/></g></svg></div><div class="seam"></div><h1>Risco zero: <b>7 dias de garantia.</b></h1><p class="sub">Entra, faz a sua primeira peça, sente o caimento. Não amou? Devolvo 100%, sem burocracia.</p><span class="cta">Fazer o quiz →</span><div class="micro">descubra seu perfil em 2 min</div>
</div></body></html>
