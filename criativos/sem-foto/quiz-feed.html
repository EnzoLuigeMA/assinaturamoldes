<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1350px;overflow:hidden;color:var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:70px 80px;
background:radial-gradient(1100px 680px at 50% -8%,rgba(240,113,79,.16),rgba(240,113,79,0) 56%),radial-gradient(820px 560px at 50% 112%,rgba(227,173,87,.09),rgba(227,173,87,0) 60%),var(--bg)}
.seam{height:0;border-top:3px dashed var(--coral);width:70px;margin-bottom:26px}
.motifbox{height:320px;display:grid;place-items:center;margin-bottom:32px}
.motifbox svg{height:100%;width:auto;max-width:100%}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.012em;line-height:1.08;font-size:60px;text-wrap:balance;max-width:18ch}
h1 b{color:var(--coral);font-weight:400}
.sub{font-size:25px;line-height:1.5;color:var(--inks);margin-top:18px;max-width:30ch}
.badges{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
.badge{font-size:21px;font-weight:600;color:var(--inks);background:rgba(246,234,224,.05);border:1px solid rgba(246,234,224,.16);border-radius:100px;padding:12px 20px}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--coral);color:var(--onc);font-weight:800;font-size:28px;border-radius:18px;padding:22px 40px;box-shadow:0 16px 38px rgba(240,113,79,.32);margin-top:34px}
.micro{margin-top:14px;color:var(--muted);font-weight:600;font-size:20px}
</style></head><body><div class="stage">
<div class="seam"></div><h1><b>Que costureira</b> é você?</h1><p class="sub">Faz o quiz e descobre o seu perfil — e o caminho pra fazer as peças que você sonha, mesmo começando agora.</p><div class="badges"><span class="badge">🧵 Moldes profissionais</span><span class="badge">🌱 Pra iniciante também</span><span class="badge">💛 +200 alunas</span></div><span class="cta">Começar o quiz →</span><div class="micro">⚡ 2 minutinhos · resultado na hora</div>
</div></body></html>
