<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
.photo{height:660px;background:#1a0d11 url('../amanda-saiacamadas.jpg') 82% 20%/188% auto no-repeat;position:relative}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,18,24,0) 56%,rgba(46,18,24,.92) 100%)}
.body{flex:1;padding:44px 64px 56px;display:flex;flex-direction:column;background:radial-gradient(900px 520px at 50% 130%,rgba(227,173,87,.12),rgba(227,173,87,0) 62%),linear-gradient(180deg,var(--surface),var(--bg))}
.seam{height:0;border-top:3px dashed var(--brass);width:64px;margin-bottom:22px}
.quote{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.15;font-size:52px;text-wrap:balance}
.quote .mark{color:var(--coral)}
.who{display:flex;align-items:center;gap:16px;margin-top:26px}
.av{width:74px;height:74px;border-radius:50%;background:#1a0d11 url('../av-amanda.webp') center/cover no-repeat;border:2px solid var(--brass);flex-shrink:0}
.who .n{font-size:23px;color:var(--inks)}.who .n b{color:var(--ink)}
.who .n span{display:block;color:var(--muted);font-size:19px;margin-top:2px}
.tag{margin-top:24px;font-size:27px;font-weight:700;color:var(--coral)}
.spacer{flex:1}
.cta{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;background:var(--coral);color:var(--onc);font-weight:800;font-size:29px;border-radius:18px;padding:22px 36px;box-shadow:0 18px 40px rgba(240,113,79,.34)}
.micro{margin-top:14px;color:var(--muted);font-weight:600;font-size:21px}
</style></head><body>
<div class="stage">
  <div class="photo"></div>
  <div class="body">
    <div class="seam"></div>
    <div class="quote"><span class="mark">"</span>Fiz a minha primeira peça da assinatura, a saia lápis. É bem fácil de fazer, eu amei.<span class="mark">"</span></div>
    <div class="who"><div class="av"></div><div class="n"><b>Amanda</b><span>aluna · primeira peça</span></div></div>
    <div class="tag">Iniciante também faz. E faz bonito.</div>
    <div class="spacer"></div>
    <span class="cta">Quero descobrir meu perfil →</span>
    <div class="micro">leva 2 min · resultado na hora</div>
  </div>
</div>
</body></html>
