<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1080px;position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(900px 620px at 18% 0%,rgba(240,113,79,.16),rgba(240,113,79,0) 58%),radial-gradient(700px 560px at 100% 100%,rgba(227,173,87,.12),rgba(227,173,87,0) 60%),var(--bg);display:flex}
.left{width:560px;padding:70px 56px;display:flex;flex-direction:column;justify-content:center}
.seam{height:0;border-top:3px dashed var(--coral);width:64px;margin-bottom:26px}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.07;font-size:62px;text-wrap:balance}
h1 .hl{color:var(--coral)}
.sub{font-size:25px;line-height:1.5;color:var(--inks);margin-top:20px;max-width:26ch}
.cta{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--coral);color:var(--onc);font-weight:800;font-size:26px;border-radius:16px;padding:20px 30px;box-shadow:0 16px 36px rgba(240,113,79,.34);margin-top:30px}
.micro{margin-top:14px;color:var(--muted);font-weight:600;font-size:19px}
.right{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
.dress{width:380px;height:760px}
</style></head><body>
<div class="stage">
  <div class="left">
    <div class="seam"></div>
    <h1>Aquele <span class="hl">vestido</span> que só existe na sua cabeça?</h1>
    <p class="sub">Dá pra tirar do sonho e botar no corpo — do corte ao caimento, sem travar na modelagem.</p>
    <span class="cta">Descobrir meu perfil →</span>
    <div class="micro">leva 2 min · resultado na hora</div>
  </div>
  <div class="right">
    <svg class="dress" viewBox="0 0 200 400" fill="none" stroke="#f0714f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <g opacity=".25" stroke="#e3ad57"><line x1="40" y1="36" x2="160" y2="36"/><path d="M100 22a8 8 0 0 1 0 16"/></g>
      <path d="M100 40 L78 60 L60 78 M100 40 L122 60 L140 78"/>
      <path d="M78 60 C70 96 64 120 60 150 C50 230 44 300 40 372 L160 372 C156 300 150 230 140 150 C136 120 130 96 122 60"/>
      <path d="M78 60 C90 78 110 78 122 60" opacity=".9"/>
      <path d="M70 120 C92 138 108 138 130 120" opacity=".5" stroke="#e3ad57"/>
      <path d="M64 150 L136 150" opacity=".35" stroke-dasharray="4 8"/>
      <g opacity=".5" stroke="#e3ad57" stroke-dasharray="3 9"><path d="M58 170 C76 188 124 188 142 170"/><path d="M54 220 C76 240 124 240 146 220"/><path d="M50 280 C76 300 124 300 150 280"/></g>
    </svg>
  </div>
</div>
</body></html>
