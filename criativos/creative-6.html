<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1080px;position:relative;overflow:hidden;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
.split{height:600px;display:flex;position:relative}
.half{flex:1;position:relative;overflow:hidden}
.half.a{background:linear-gradient(180deg,var(--surface),#3a1a22);display:grid;place-items:center;padding:46px}
.half.a::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 300px at 50% 42%,rgba(227,173,87,.10),rgba(227,173,87,0) 70%)}
.half.a .molde{width:72%;height:auto;position:relative}
.half.b{background:#1a0d11 url('../rose-macacaovermelho.jpg') 50% 48%/150% auto no-repeat}
.half.b::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(46,18,24,.10),rgba(46,18,24,.5))}
.tag{position:absolute;bottom:22px;left:22px;z-index:2;font-size:21px;font-weight:700;padding:9px 17px;border-radius:100px;background:rgba(46,18,24,.7);border:1px solid rgba(246,234,224,.16)}
.half.a .tag{color:var(--brass)}.half.b .tag{color:var(--coral)}
.divider{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:3px dashed var(--coral);transform:translateX(-1.5px);z-index:3}
.body{flex:1;padding:46px 60px 52px;display:flex;flex-direction:column;background:radial-gradient(900px 480px at 50% 130%,rgba(240,113,79,.15),rgba(240,113,79,0) 62%),linear-gradient(180deg,var(--surface),var(--bg))}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.08;font-size:54px;text-wrap:balance}
h1 .hl{color:var(--coral)}
.sub{font-size:24px;line-height:1.45;color:var(--inks);margin-top:16px;max-width:38ch}
.quote{margin-top:14px;font-size:20px;color:var(--muted);font-style:italic}
.spacer{flex:1}
.cta{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;background:var(--coral);color:var(--onc);font-weight:800;font-size:27px;border-radius:16px;padding:20px 34px;box-shadow:0 16px 36px rgba(240,113,79,.34)}
.micro{margin-top:13px;color:var(--muted);font-weight:600;font-size:19px}
</style></head><body>
<div class="stage">
  <div class="split">
    <div class="half a">
      <svg class="molde" viewBox="0 0 320 380" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <g stroke="#e3ad57" stroke-width="1.4" stroke-dasharray="3 7" opacity=".5"><path d="M92 56 C128 49 192 49 228 56 L262 334 L58 334 Z"/><path d="M82 46 C124 38 196 38 238 46 L274 344 L46 344 Z"/></g>
        <path d="M102 66 C132 60 188 60 218 66 L252 324 L68 324 Z" stroke="#f0714f" stroke-width="2.6"/>
        <path d="M110 80 C136 75 184 75 210 80 L242 312 L78 312 Z" stroke="#f6eae0" stroke-width="1.3" stroke-dasharray="2 6" opacity=".55"/>
        <path d="M150 64 L160 128 L170 64" stroke="#f0714f" stroke-width="1.8"/>
        <g stroke="#f0714f" stroke-width="2"><line x1="160" y1="150" x2="160" y2="286"/><path d="M152 160 L160 148 L168 160"/><path d="M152 276 L160 288 L168 276"/></g>
        <text x="244" y="60" font-family="Hanken Grotesk,sans-serif" font-size="14" font-weight="800" fill="#e3ad57">GG</text>
        <text x="222" y="80" font-family="Hanken Grotesk,sans-serif" font-size="13" font-weight="800" fill="#f0714f">PP</text>
      </svg>
      <span class="tag">molde</span>
    </div>
    <div class="half b"><span class="tag">peça pronta</span></div>
    <div class="divider"></div>
  </div>
  <div class="body">
    <h1>Do <span class="hl">molde de papel</span> ao caimento no corpo.</h1>
    <p class="sub">4 moldes profissionais por mês, vídeo-aula de montagem e ficha técnica. O caminho inteiro, sem buraco.</p>
    <p class="quote">"Amei costurar! Deu vontade de fazer um de cada cor." — Rose</p>
    <div class="spacer"></div>
    <span class="cta">Descobrir meu perfil →</span>
    <div class="micro">leva 2 min · resultado na hora</div>
  </div>
</div>
</body></html>
