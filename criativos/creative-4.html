<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(1100px 720px at 50% -6%,rgba(240,113,79,.18),rgba(240,113,79,0) 56%),radial-gradient(820px 580px at 50% 114%,rgba(227,173,87,.09),rgba(227,173,87,0) 60%),var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:150px 80px}
.seam{height:0;border-top:3px dashed var(--coral);width:74px;margin-bottom:34px}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.012em;line-height:1.05;font-size:96px;text-wrap:balance}
h1 .hl{color:var(--coral);display:block}
.lead{font-size:31px;line-height:1.55;color:var(--muted);margin-top:30px;max-width:28ch}
.badges{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.badge{font-size:23px;font-weight:600;color:var(--inks);background:rgba(246,234,224,.05);border:1px solid var(--line,rgba(246,234,224,.16));border-radius:100px;padding:14px 24px}
.cta{display:inline-flex;align-items:center;gap:14px;background:var(--coral);color:var(--onc);font-weight:800;font-size:34px;border-radius:20px;padding:28px 46px;box-shadow:0 20px 46px rgba(240,113,79,.36);margin-top:52px}
.micro{margin-top:18px;color:var(--muted);font-weight:600;font-size:24px}
</style></head><body>
<div class="stage">
  <div class="seam"></div>
  <h1>Descubra o seu <span class="hl">perfil de costureira</span></h1>
  <p class="lead">Responde umas perguntas rápidas e a gente revela o seu perfil — e o caminho pra fazer as peças que você sonha, mesmo começando agora.</p>
  <div class="badges">
    <span class="badge">🧵 Moldes profissionais</span>
    <span class="badge">🌱 Pra iniciante também</span>
    <span class="badge">💛 +200 alunas</span>
  </div>
  <span class="cta">Começar o quiz →</span>
  <div class="micro">⚡ 2 minutinhos · resultado na hora</div>
</div>
</body></html>
