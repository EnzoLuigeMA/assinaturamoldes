<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#2e1218;--surface:#43202a;--ink:#f6eae0;--inks:#ecd7cc;--muted:#d3aaa4;--coral:#f0714f;--brass:#e3ad57;--onc:#38131a;--serif:'Young Serif',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:#222}
.stage{width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(1100px 700px at 50% -8%,rgba(240,113,79,.16),rgba(240,113,79,0) 56%),radial-gradient(800px 560px at 50% 112%,rgba(227,173,87,.08),rgba(227,173,87,0) 60%),var(--bg);display:flex;flex-direction:column;padding:130px 70px 120px}
.hook{font-size:33px;font-weight:600;color:var(--inks);line-height:1.4}
.hook .q{color:var(--muted)}
.seam{height:0;border-top:3px dashed var(--coral);width:70px;margin:30px 0}
.frame{flex:1;border-radius:26px;background:linear-gradient(180deg,var(--surface),#3a1a22);border:1px solid rgba(246,234,224,.14);box-shadow:inset 0 0 120px rgba(0,0,0,.35);position:relative;display:grid;place-items:center;padding:40px;overflow:hidden}
.frame::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 420px at 50% 42%,rgba(227,173,87,.10),rgba(227,173,87,0) 70%)}
.molde{width:74%;height:auto;position:relative}
.flabel{position:absolute;left:24px;bottom:22px;font-size:22px;font-weight:700;color:var(--ink);background:rgba(46,18,24,.72);padding:10px 18px;border-radius:100px;border:1px solid rgba(246,234,224,.16)}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.08;font-size:78px;text-wrap:balance;margin-top:46px}
h1 .hl{color:var(--coral)}
.sub{font-size:29px;line-height:1.5;color:var(--inks);margin-top:24px;max-width:30ch}
.cta{display:inline-flex;align-items:center;gap:14px;align-self:flex-start;background:var(--coral);color:var(--onc);font-weight:800;font-size:32px;border-radius:18px;padding:26px 42px;box-shadow:0 18px 40px rgba(240,113,79,.34);margin-top:38px}
.micro{margin-top:16px;color:var(--muted);font-weight:600;font-size:22px}
</style></head><body>
<div class="stage">
  <div class="hook"><span class="q">"</span>Será que isso é pra mim, que tô começando agora?<span class="q">"</span></div>
  <div class="seam"></div>
  <div class="frame">
    <svg class="molde" viewBox="0 0 320 380" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <g stroke="#e3ad57" stroke-width="1.4" stroke-dasharray="3 7" opacity=".5">
        <path d="M92 56 C128 49 192 49 228 56 L262 334 L58 334 Z"/>
        <path d="M82 46 C124 38 196 38 238 46 L274 344 L46 344 Z"/>
      </g>
      <path d="M102 66 C132 60 188 60 218 66 L252 324 L68 324 Z" stroke="#f0714f" stroke-width="2.6"/>
      <path d="M110 80 C136 75 184 75 210 80 L242 312 L78 312 Z" stroke="#f6eae0" stroke-width="1.3" stroke-dasharray="2 6" opacity=".55"/>
      <path d="M150 64 L160 128 L170 64" stroke="#f0714f" stroke-width="1.8"/>
      <g stroke="#f0714f" stroke-width="2"><line x1="160" y1="150" x2="160" y2="286"/><path d="M152 160 L160 148 L168 160"/><path d="M152 276 L160 288 L168 276"/></g>
      <path d="M86 210 l11 3 M234 210 l-11 3" stroke="#f6eae0" stroke-width="2" opacity=".7"/>
      <text x="244" y="60" font-family="Hanken Grotesk,sans-serif" font-size="14" font-weight="800" fill="#e3ad57">GG</text>
      <text x="222" y="80" font-family="Hanken Grotesk,sans-serif" font-size="13" font-weight="800" fill="#f0714f">PP</text>
    </svg>
    <span class="flabel">📐 molde já modelado, do PP ao GG</span>
  </div>
  <h1>É sim. A gente começa <span class="hl">pela modelagem</span> — não pela perfeição.</h1>
  <p class="sub">Molde já pronto, vídeo-aula de montagem e ficha técnica. Você só corta e costura.</p>
  <span class="cta">Fazer o quiz →</span>
  <div class="micro">descubra seu perfil em 2 min</div>
</div>
</body></html>
